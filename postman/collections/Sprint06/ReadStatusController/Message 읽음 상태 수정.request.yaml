$kind: http-request
url: "{{baseURL}}/api/readStatuses/{{readStatusId}}"
method: PATCH
body:
  type: json
  content: "{\r

    \    \"lastReadAt\": \"{{currentTimestamp}}\"\r

    }"
scripts:
  - type: beforeRequest
    code: "const now = new Date().toISOString();\r

      pm.collectionVariables.set(\"currentTimestamp\", now);"
    language: text/javascript
order: 2000
