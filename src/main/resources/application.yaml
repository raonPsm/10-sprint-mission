spring:
  application:
    name: discodeit
server:
  port: 8080

discodeit:
  repository:
    type: jcf # jcf | file (기본값 jcf)
    file-directory: discodeit.fileRepo # File 기반 저장 시 사용할 디렉토리명

## Swagger-UI 설정
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  default-produces-media-type: application/json

datasource:
  url: jdbc:postgresql://localhost:5432/discodeit
  username: discodeit_user
  password: discodeit1234
  driver-class-name: org.postgresql.Driver

jpa:
  hibernate:
    ddl-auto: validate
  show-sql: true # 실행되는 SQL을 콘솔에 출력
  properties:
    hibernate:
      format_sql: true # SQL을 보기 좋게 정렬
      use_sql_comments: true