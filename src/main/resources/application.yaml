spring:
  application:
    name: discodeit # 애플리케이션 이름 -> discodeit

  # 애플리케이션이 사용할 DB 연결 정보
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit # PostgreSQL DB에 접속하기 위한 JDBC URL
      # jdbc:postgresql: -> PostgreSQL JDBC 드라이버 사용
      # localhost -> DB 서버 주소
      # 5432 -> PostgreSQL의 기본 포트 번호
      # discodeit -> 접속할 데이터베이스 이름
    username: discodeit_user # DB 접속 계정명
    password: discodeit1234 # 비밀번호 FIXME: ${DB_PASSWORD} + .env 파일로 관리
    driver-class-name: org.postgresql.Driver # PostgreSQL JDBC 드라이버 클래스 명시

  jpa:
    # hibernate:
      # schema.sql을 통해 테이블을 직접 생성하므로,
      # 애플리케이션 실행 시 DB 구조가 일치하는지 검증만 수행
      # 엔티티에 필드가 있는데 DB 컬럼이 없으면 예외를 내고 실행이 실패할 수 있음 => validate
      # ddl-auto: validate # create -> 엔티티로 등록된 클래스와 매핑되는 테이블을 자동으로 생성
    # show-sql: true # Hibernate가 실행하는 SQL을 콘솔에 출력 -> org.hibernate.SQL: debug와 겹침
    properties:
      hibernate:
        format_sql: true # SQL을 보기 좋게 정렬
        highlight_sql: true # 콘솔 로그에 색상
        use_sql_comments: true # 쿼리에 주석을 추가
    # 심화 요구사항: 성능과 명확한 트랜잭션 경계를 위해 OSIV를 비활성화
    # Hibernate Session / 영속성 컨텍스트를 웹 요청이 끝날 때까지 계속 열어두지 않고
    # 서비스 계층 트랜잭션 범위 안에서만 사용하도록 제한
    # Lazy 연관관계를 컨트롤러 / 직렬화 시점에 건드리면 LazyInitializationException이 발생할 수 있음
    # -> DTO로 변환 시점에 필요한 데이터를 모두 조회하도록 쿼리를 최적화해야 함
    open-in-view: false

  # 사용이유 1 - JPA가 자동으로 생성해주는 DDL은 ON DELETE SET NULL 같은 상세한 DB 제약 조건을 완벽하게 생성하지 못하는 경우가 많다.
  # 사용이유 2 - ddl-auto는 코드에 따라 실시간으로 변하므로 git을 통해 이력 관리가 어렵다
    # ddl-auto가 생성한 SQL 코드는 기본적으로 파일 형태로 남지 않고 메모리상에서 실행된후 사라진다.
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: 8080 # 내장 Tomcat 서버 8080 포트에서 실행

## Swagger-UI 설정
springdoc:
  api-docs:
    enabled: true # OpenAPI 명세 자동 생성 기능 활성화 -> http://localhost:8080/v3/api-docs
  swagger-ui:
    enabled: true # Swagger UI 웹 화면을 활성화 -> http://localhost:8080/swagger-ui/index.html
  default-produces-media-type: application/json # API 문서에서 기본 응답 콘텐츠 타입을 application/json으로 간주하도록 설정

logging:
  level:
    # Hibernate가 실행하는 SQL 쿼리문 자체를 로그로 출력
    org.hibernate.SQL: debug
    # 쿼리 파라미터(PreparedStatement)에 바인딩되는 값을 확인하기 위한 설정
    org.hibernate.orm.jdbc.bind: trace

discodeit:
  storage:
    type: local
    # 설정값(local)과 어노테이션에 지정된 havingValue가 일치하므로 LocalBinaryContentStorage는 스프링 빈으로 등록됨
    local:
      root-path: .discodeit/storage
      # @Value("${discodeit.storage.local.root-path}") 를 통해서 할당됨