spring:
  application:
    name: discodeit
  servlet:
    multipart:
      maxFileSize: 10MB
      maxRequestSize: 30MB
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  profiles:
    active:
      - dev
  config:
    import: optional:file:.env[.properties]
  cache:
    type: caffeine # Srping Cache의 구현체로 Caffeine을 사용
    cache-names: users, userChannels, userNotifications # 사용한 캐시 이름 목록
    caffeine:
      # 캐시에 저장할 수 있는 최대 항목 수, 마지막 접근으로부터 600초 후 반료, 캐시 통계 수집 활성화
      spec: maximumSize=100, expireAfterAccess=600s, recordStats

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,caches,prometheus
  endpoint:
    health:
      show-details: always
  observations:
    annotations:
      enabled: true

info:
  name: Discodeit
  version: 1.7.0
  java:
    version: 17
  spring-boot:
    version: 3.4.0
  config:
    datasource:
      url: ${spring.datasource.url}
      driver-class-name: ${spring.datasource.driver-class-name}
    jpa:
      ddl-auto: ${spring.jpa.hibernate.ddl-auto}
    storage:
      type: ${discodeit.storage.type}
      path: ${discodeit.storage.local.root-path}
    multipart:
      max-file-size: ${spring.servlet.multipart.maxFileSize}
      max-request-size: ${spring.servlet.multipart.maxRequestSize}

discodeit:
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}
  admin:
    username: ${DISCODEIT_ADMIN_USERNAME:admin}
    email: ${DISCODEIT_ADMIN_EMAIL:admin@discodeit.com}
    password: ${DISCODEIT_ADMIN_PASSWORD:admin1234}
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiry: 1800000 # 30 minutes (ms)
    refresh-token-expiry: 1209600000 # 14 days (ms)
    max-active-count: 1 # 최대 동시 로그인 수

logging:
  level:
    root: info
