spring:
  application:
    name: discodeit
server:
  port: 8080

discodeit:
  repository:
    type: jcf # jcf | file (기본값 jcf)
    file-directory: discodeit.fileRepo # File 기반 저장 시 사용할 디렉토리명

# Swagger-UI 설정
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /docs  # 접속할 경로 설정 (기본값은 /swagger-ui/index.html)
  default-produces-media-type: application/json